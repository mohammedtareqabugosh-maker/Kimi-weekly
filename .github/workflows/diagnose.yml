name: Diagnose blank page
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build
        run: corepack enable && corepack prepare pnpm@10.18.3 --activate && pnpm install --no-frozen-lockfile && pnpm run build
      - name: Install Playwright
        run: mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.49.0 && npx playwright install --with-deps chromium
      - name: Load built pages and record errors
        run: |
          cd dist && python3 -m http.server 4173 >/tmp/http.log 2>&1 &
          sleep 2
          cat > /tmp/pw/diag.cjs <<'JS'
          const { chromium } = require('/tmp/pw/node_modules/playwright');
          (async () => {
            const b = await chromium.launch();
            const out = [];
            for (const p of ['/', '/blank.html']) {
              const pg = await b.newPage();
              const errs = [];
              pg.on('pageerror', e => errs.push('PAGEERROR: ' + e.message));
              pg.on('console', m => { if (m.type() === 'error') errs.push('CONSOLE: ' + m.text()); });
              pg.on('response', r => { if (r.status() >= 400) errs.push('HTTP ' + r.status() + ' ' + r.url()); });
              pg.on('requestfailed', r => errs.push('REQFAILED ' + r.url() + ' ' + (r.failure() && r.failure().errorText)));
              await pg.goto('http://localhost:4173' + p, { waitUntil: 'load' });
              await pg.waitForTimeout(3000);
              const root = await pg.evaluate(() => { const el = document.getElementById('root'); return el ? el.innerHTML.length : -1; });
              const text = await pg.evaluate(() => document.body.innerText.length);
              out.push('== ' + p + ' | #root html length: ' + root + ' | body text length: ' + text);
              out.push(...errs.slice(0, 30));
              await pg.close();
            }
            require('fs').writeFileSync('/tmp/report.txt', out.join('\n') + '\n');
            console.log(out.join('\n'));
            await b.close();
          })();
          JS
          node /tmp/pw/diag.cjs
      - name: Publish report to diagnostics branch
        run: |
          cp /tmp/report.txt /tmp/report-copy.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan diagnostics-tmp
          git rm -rf -q . || true
          cp /tmp/report-copy.txt report.txt
          git add report.txt
          git commit -q -m "Diagnostic report"
          git push -q -f origin HEAD:diagnostics
